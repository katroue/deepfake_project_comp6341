# Strategy 2: Heavy Augmentation Configuration

strategy_name: "Heavy Augmentation"
strategy_description: "Extensive geometric and color transformations"

# Data
data_root: data_root: "/kaggle/input/your-dataset-name/"
compression: "c23"

# Model
model: "efficientnet_b1"
num_classes: 2
pretrained: true
dropout: 0.3

# Training
batch_size: 32
num_epochs: 20
learning_rate: 0.0001
weight_decay: 0.0001
num_workers: 6

# Augmentation
augmentation: "heavy"  # rotation, color jitter, perspective, cutout

# Heavy Augmentation Parameters
augmentation_params:
  rotation_degrees: 15
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.1
  random_affine:
    translate: [0.1, 0.1]
    scale: [0.9, 1.1]
  random_perspective:
    distortion_scale: 0.2
    p: 0.5
  random_erasing:
    p: 0.3
    scale: [0.02, 0.1]

# Paths
save_dir: "results/models/c23/strategy2_augmented"
log_dir: "results/logs/c23"

# Device
device: "auto"  # auto-detect MPS/CUDA/CPU