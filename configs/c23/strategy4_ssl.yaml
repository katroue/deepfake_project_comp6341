# Strategy 4: Self-Supervised Learning Configuration

strategy_name: "Self-Supervised Pretraining"
strategy_description: "Two-phase: SSL on unlabeled faces then fine-tune on FF++"

# Data
data_root: "data/"
compression: "c23"

# Model
model: "efficientnet_b1"
num_classes: 2
pretrained: false  # Train from scratch in Phase 1
dropout: 0.3

# Phase 1: Self-Supervised Pretraining
phase_1:
  enabled: true
  method: "SimCLR"  # Contrastive learning
  data_root: "data/"  # Uses FF++ faces (labels ignored in contrastive pretraining)
  num_epochs: 10
  batch_size: 32
  learning_rate: 0.001
  temperature: 0.5
  projection_dim: 128
  augmentation: "strong"  # Strong augmentation for contrastive learning

# Phase 2: Supervised Fine-tuning
phase_2:
  enabled: true
  load_pretrained: true
  pretrained_path: "results/models/c23/strategy4_ssl/phase1_pretrained/best_model.pth"
  num_epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  augmentation: "baseline"
  freeze_backbone_epochs: 3  # Freeze first 3 epochs

# Paths
save_dir: "results/models/c23/strategy4_ssl"
log_dir: "results/logs/c23"

# Device
device: "auto"  # auto-detect MPS/CUDA/CPU