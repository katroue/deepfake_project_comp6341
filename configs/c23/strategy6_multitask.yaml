# Strategy 6: Multi-Task Learning Configuration

strategy_name: "Multi-Task Learning"
strategy_description: "Joint training: binary (real/fake) + manipulation type"

# Data
data_root: "data/"
compression: "c23"

# Model
model: "multitask_efficientnet_b1"
num_binary_classes: 2  # Real, Fake
num_multiclass_classes: 5  # Real, Deepfakes, Face2Face, FaceSwap, NeuralTextures
pretrained: true
dropout: 0.3

# Training
batch_size: 32
num_epochs: 20
learning_rate: 0.0001
weight_decay: 0.0001
num_workers: 6

# Augmentation
augmentation: "baseline"  # minimal

# Multi-Task Loss Weights
loss_weights:
  binary: 0.7  # Primary task (main goal)
  multiclass: 0.3  # Auxiliary task (helps learning)

# Task Configuration
tasks:
  binary:
    name: "Real vs Fake"
    classes: ["Real", "Fake"]
    loss: "CrossEntropyLoss"
  multiclass:
    name: "Manipulation Type"
    classes: ["Real", "Deepfakes", "Face2Face", "FaceSwap", "NeuralTextures"]
    loss: "CrossEntropyLoss"

# Paths
save_dir: "results/models/c23/strategy6_multitask"
log_dir: "results/logs/c23"

# Device
device: "auto"  # auto-detect MPS/CUDA/CPU