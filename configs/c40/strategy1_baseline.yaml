# Strategy 1: Baseline Configuration

strategy_name: "Baseline"
strategy_description: "Standard fine-tuning with minimal augmentation"

# Data
data_root: "data/"
compression: "c40"

# Model
model: "efficientnet_b1"
num_classes: 2
pretrained: true
dropout: 0.3

# Training
batch_size: 32
num_epochs: 20
learning_rate: 0.0001
weight_decay: 0.0001
num_workers: 6

# Augmentation
augmentation: "baseline"  # minimal

# Paths
save_dir: "results/models/c40/strategy1_baseline"
log_dir: "results/logs/c40"

# Device
device: "auto"  # auto-detect MPS/CUDA/CPU