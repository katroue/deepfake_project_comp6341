# Strategy 3: Curriculum Learning Configuration

strategy_name: "Curriculum Learning"
strategy_description: "Progressive difficulty training: easy to hard manipulations"

# Data
data_root: "data/"
compression: "c40"

# Model
model: "efficientnet_b1"
num_classes: 2
pretrained: true
dropout: 0.3

# Training
batch_size: 32
num_epochs: 20
learning_rate: 0.0001
weight_decay: 0.0001
num_workers: 6

# Augmentation
augmentation: "baseline"  # minimal (don't interfere with curriculum)

# Curriculum Schedule
curriculum:
  phase_1:
    epochs: [0, 5]
    manipulations: ["Face2Face"]
  phase_2:
    epochs: [6, 10]
    manipulations: ["Face2Face", "FaceSwap"]
  phase_3:
    epochs: [11, 15]
    manipulations: ["Face2Face", "FaceSwap", "Deepfakes"]
  phase_4:
    epochs: [16, 20]
    manipulations: ["Face2Face", "FaceSwap", "Deepfakes", "NeuralTextures"]

# Paths
save_dir: "results/models/strategy3_curriculum"
log_dir: "results/logs"

# Device
device: "auto"  # auto-detect MPS/CUDA/CPU